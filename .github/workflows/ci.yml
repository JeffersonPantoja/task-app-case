name: CI

on:
  push:
    branches:
      - desenvolvimento
      - estagio
      - producao
    tags:
      - "v*"
  pull_request:
    branches:
      - desenvolvimento
      - estagio
      - producao

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        working-directory: todo_project
        run: pip install -r ../requirements.txt

      - name: Validate application import
        working-directory: todo_project
        run: python -c "from todo_project import app; print(app.name)"

      - name: Check dependency consistency
        working-directory: todo_project
        run: pip check

      - name: Run unit tests
        run: pytest -q

      - name: Build Docker image
        run: docker build -t task-app-ci .

      - name: Start application container
        run: docker run -d --rm --name task-app-ci -p 5000:5000 task-app-ci

      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 30); do
            if curl --fail http://127.0.0.1:5000/; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Stop application container
        if: always()
        run: docker stop task-app-ci

  bandit-sast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Bandit
        run: python -m pip install --upgrade pip bandit Jinja2

      - name: Run Bandit
        run: |
          mkdir -p bandit-report
          bandit -r todo_project -lll -x tests -f html -o bandit-report/bandit-report.html

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report/
          if-no-files-found: warn

  dependency-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        id: DependencyCheck
        continue-on-error: true
        with:
          project: "Task-Manager-using-Flask"
          path: "."
          format: "HTML"
          out: "dependency-check-report"
          args: --nvdApiKey ${{ secrets.NVD_API_KEY }}

      - name: Install pip-audit
        run: python -m pip install --upgrade pip-audit

      - name: Run pip-audit
        working-directory: todo_project
        continue-on-error: true
        run: |
          mkdir -p ../pip-audit-report
          pip-audit -r ../requirements.txt -f markdown -o ../pip-audit-report/pip-audit.md

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report/
          if-no-files-found: warn

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report/
          if-no-files-found: warn

  zap-dast:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t task-app-ci .

      - name: Create Docker network
        run: docker network create zap-net || true

      - name: Start application container
        run: |
          docker run -d --rm --name web \
            --network zap-net \
            -p 5000:5000 \
            task-app-ci

      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 30); do
            if curl --fail http://127.0.0.1:5000/; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Start ZAP daemon
        run: |
          mkdir -p zap-report
          docker run -d --rm --name zap \
            --network zap-net \
            -p 8090:8090 \
            -v ${{ github.workspace }}/zap-report:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap.sh -daemon -port 8090 -host 0.0.0.0 \
            -config api.disablekey=true \
            -config api.addrs.addr.name=.* \
            -config api.addrs.addr.regex=true

      - name: Wait for ZAP to be ready
        run: |
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/8090) 2>/dev/null; then
              echo "ZAP ready"
              exit 0
            fi
            sleep 5
          done
          echo "ZAP did not start in time"
          docker logs zap
          exit 1

      - name: Run app exploration script
        run: |
          docker run --rm --network zap-net \
            -v ${{ github.workspace }}/zap-scan:/zap-scan:ro \
            python:3.12-slim \
            sh -c "pip install -q requests && python /zap-scan/explore.py"

      - name: Run Active Scan
        run: |
          echo "Starting Active Scan on http://web:5000..."
          scan_response=$(curl -s -X POST "http://127.0.0.1:8090/JSON/ascan/action/scan/?url=http://web:5000&recurse=true")
          echo "Scan response: $scan_response"
          scan_id=$(echo "$scan_response" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          print(d.get('scan', d.get('scanId', '')))
          ")
          if [ -z "$scan_id" ]; then
            echo "Failed to get scan ID"
            exit 1
          fi
          echo "Scan ID: $scan_id"

          for i in $(seq 1 60); do
            status_response=$(curl -s "http://127.0.0.1:8090/JSON/ascan/view/status/?scanId=$scan_id")
            progress=$(echo "$status_response" | python3 -c "
            import sys, json
            print(json.load(sys.stdin).get('status', '0'))
            ")
            echo "Progress: $progress%"
            if [ "$progress" = "100" ]; then
              echo "Active Scan completed!"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Timeout waiting for Active Scan"
              exit 1
            fi
            sleep 10
          done

      - name: Generate ZAP report
        run: |
          site_url=$(curl -s http://127.0.0.1:8090/JSON/core/view/sites/ | \
            python3 -c "
            import sys, json
            d = json.load(sys.stdin)
            sites = d.get('sites', [])
            print(sites[0] if sites else 'http://web:5000')
            ")
          echo "Using site: $site_url"

          curl -s -X POST http://127.0.0.1:8090/JSON/reports/action/generate/ \
            -d "title=DAST+Scan+Report" \
            -d "template=traditional-html" \
            -d "sites=$site_url" \
            -d "reportDir=/zap/wrk" \
            -d "reportFile=zap-report.html"

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report/
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: |
          docker stop web zap || true
          docker network rm zap-net || true
