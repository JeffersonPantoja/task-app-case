name: CI

on:
  push:
    branches:
      - desenvolvimento
      - estagio
      - producao
    tags:
      - "v*"
  pull_request:
    branches:
      - desenvolvimento
      - estagio
      - producao

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install dependencies
        working-directory: todo_project
        run: pip install -r ../requirements.txt

      - name: Validate application import
        working-directory: todo_project
        run: python -c "from todo_project import app; print(app.name)"

      - name: Check dependency consistency
        working-directory: todo_project
        run: pip check

      - name: Run unit tests
        run: pytest -q

      - name: Build Docker image
        run: docker build -t task-app-ci .

      - name: Start application container
        run: docker run -d --rm --name task-app-ci -p 5000:5000 task-app-ci

      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 30); do
            if curl --fail http://127.0.0.1:5000/; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Stop application container
        if: always()
        run: docker stop task-app-ci

  bandit-sast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install Bandit
        run: python -m pip install --upgrade pip bandit Jinja2

      - name: Run Bandit
        run: |
          mkdir -p bandit-report
          bandit -r todo_project -lll -x tests -f html -o bandit-report/bandit-report.html

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report/
          if-no-files-found: warn

  dependency-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Dependency-Check data
        uses: actions/cache@v4
        with:
          path: dependency-check-data
          key: dependency-check-data-${{ runner.os }}
          restore-keys: |
            dependency-check-data-${{ runner.os }}-

      - name: Run OWASP Dependency-Check
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mkdir -p dependency-check-report
          mkdir -p dependency-check-data
          EXTRA_ARGS=""
          if [ -n "$NVD_API_KEY" ]; then
            EXTRA_ARGS="--nvdApiKey $NVD_API_KEY"
          fi
          docker run --rm \
            -v "${PWD}:/src" \
            -v "${PWD}/dependency-check-data:/usr/share/dependency-check/data" \
            -v "${PWD}/dependency-check-report:/report" \
            owasp/dependency-check:latest \
            --project "Task-Manager-using-Flask" \
            --scan /src/requirements.txt \
            --format HTML \
            $EXTRA_ARGS \
            --out /report

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report/
          if-no-files-found: warn
